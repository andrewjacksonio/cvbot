name: Terraform Plan (Non-Master Branches)

on:
  push:
    branches-ignore:
      - master  # HCP handles master branch via VCS integration
    paths:
      - 'terraform/**'  # Only run when Terraform files change
      - '.github/workflows/**'  # Also run when workflow files change
  pull_request:
    branches:
      - master
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"
          cli_config_credentials_token: ${{ secrets.TF_TOKEN_APP_ANDREWJACKSONIO }}
          cli_config_credentials_hostname: app.terraform.io

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan