name: Terraform Plan (Non-Main Branches)

on:
  push:
    branches-ignore:
      - main  # HCP handles main branch via VCS integration
    paths:
      - 'terraform/**'  # Only run when Terraform files change
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Terraform Init
        run: terraform init
        env:
          TF_TOKEN_app_andrewjacksonio: ${{ secrets.TF_TOKEN_APP_ANDREWJACKSONIO }}

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_TOKEN_app_andrewjacksonio: ${{ secrets.TF_TOKEN_APP_ANDREWJACKSONIO }}